# Bob's settings. Anything left out uses the default in config.py.

[drive]
type = "dc"                # "dc" = DC motors on a TB6612FNG, "servo" = continuous-rotation servos
pwm = "auto"               # servo only: hardware PWM if enabled, else pigpio, else software
left_pin = 12              # servo only: BCM GPIO for the left servo signal wire
right_pin = 13             # servo only: BCM GPIO for the right servo signal wire
left_invert = false        # flip if a wheel spins backwards on /fwd
right_invert = true
left_trim = 0.0            # drift fix. DC: +0.05 = this wheel 5% faster. Servo: pulse shift
right_trim = 0.0
max_speed = 0.8            # global speed cap, also adjustable live with /speed
max_move_seconds = 3.0     # longest single move Claude (or you) can command

# DC motors on a TB6612FNG (type = "dc"), BCM pin numbers
dc_left_pwm = 12           # PWMA (hardware PWM if the pwm-2chan overlay is on)
dc_left_in1 = 5            # AIN1
dc_left_in2 = 6            # AIN2
dc_right_pwm = 13          # PWMB
dc_right_in1 = 16          # BIN1
dc_right_in2 = 20          # BIN2
dc_standby = 21            # STBY
dc_pwm_hz = 20000
dc_min_duty = 0.25         # raise if motors hum without turning at low speed
dc_brake = true            # false = coast to a stop

estop_button_pin = -1      # e.g. 26 for a button between GPIO26 and GND

[camera]
source = "auto"            # "auto" tries the ribbon-cable module, then USB. Or "csi" / "usb"
device = 0                 # USB only: N in /dev/videoN
width = 640
height = 480
fov_deg = 62.0             # camera's horizontal field of view (used by following and calibration)
rotate_180 = false         # set true if the camera is mounted upside down

[sensor]
enabled = false            # HC-SR04 distance sensor; wiring in the README (ECHO needs a voltage divider)
trigger_pin = 23
echo_pin = 24
stop_cm = 15               # forward moves are refused / cut off inside this distance
max_cm = 200

[follow]
distance_m = 1.0           # follow-me distance, from the apparent size of the person's face
max_speed = 0.5
max_seconds = 60.0
lost_after_s = 3.0
turn_gain = 0.9
forward_gain = 2.5
deadzone = 0.12

[stream]
enabled = true             # MJPEG video at http://<pi-ip>:8080/
host = "0.0.0.0"           # "127.0.0.1" = only reachable through an SSH tunnel
port = 8080
fps = 10.0
dashboard = true           # control page at http://<pi>:8080/dash?token=...  (needs BOB_STREAM_TOKEN, 8+ characters)

[audio]
tts = "piper"              # natural voice, offline. Falls back to espeak-ng if Piper isn't installed
piper_model = "en_US-lessac-medium"   # downloaded into voices/ by install.sh; "-low" is faster
voice = "en-us"            # espeak-ng fallback voice
speed_wpm = 165
device = ""                # aplay -D device, e.g. "plughw:1,0" for a USB speaker

[mic]
enabled = false            # true = start listening at boot
mode = "hands-free"        # or "push-to-talk": press Tab (or /talk) to start and stop recording
device = "plughw:CARD=Device,DEV=0"   # arecord -D name for the USB mic (arecord -l lists them); the CARD= form survives reboots
model = "tiny.en"          # "base.en" is more accurate but slower
threshold = 0.02           # speech loudness; raise in noisy rooms. /listen shows the live level
silence_ms = 800
max_seconds = 15.0
after_speech_s = 1.0       # deaf this long after Bob speaks, so he doesn't answer himself
pause_while_driving = true # motor noise ruins transcripts

# Wake word (hands-free mode): Bob ignores speech until he hears it, then listens for wake_window_s.
wake_engine = "openwakeword"   # "text" = match the word "bob" in the transcript; "off" = react to everything
wake_model = "wakewords/hey_bob.onnx"   # pretrained: hey_jarvis, alexa, hey_mycroft, hey_rhasspy. Or a trained .onnx file
wake_threshold = 0.5
wake_verifier = ""             # optional: a verifier trained on your own voice with wakeword_tools.py (see README)
wake_confirm = true            # after the model fires, also check the transcript contains "bob" (cuts false wakes from "Hey Rob", "Hey Boss")
wake_word = "bob"
name_aliases = ["mom", "bub", "bop", "mob", "bomb", "bobb"]   # what the speech model mishears "Bob" as; put back to "Bob" when it OPENS what you say
initial_prompt = ""        # a hint for the speech model; empty = "The speaker is talking to a robot named Bob."
wake_window_s = 20.0

[radio]
enabled = false            # talk to the other robot (needs BOB_RADIO_SECRET in .env)
name = "Bob"
peer_name = "John"
transport = "bluetooth"    # "bluetooth", or "wifi" (same network, or a VPN such as Tailscale; manual 13)
role = "listen"            # Bob listens; the other robot uses role = "connect" with Bob's address
peer_address = ""          # only for role = "connect": the other robot's Bluetooth address, or (wifi) its host name / IP
channel = 3                # Bluetooth only
port = 8765                # Wi-Fi only
bind = "0.0.0.0"           # Wi-Fi only, for the listener: "0.0.0.0" = every network; or one address to limit it
ai_max_per_minute = 6      # cap on messages Claude may send per minute

[music]
enabled = true             # Bluetooth speaker + AirPlay receiver; run ./install_music.sh on the Pi first
bluetooth = true
airplay = true
airplay_bus = "session"
exclusive = true           # the newest source wins; the older is paused
initial_volume = 0.8
max_volume = 0.90          # cap for Bob and the console (not the phone's own volume keys)
duck_level = 0.25          # music falls to this fraction while Bob talks
duck_hold_s = 0.8
mic_deaf_while_playing = true
poll_seconds = 1.0

[timeline]
enabled = false           # true = keep a record of what Bob saw, decided and did (logs/timeline)
thumbnails = true          # ...including small camera pictures (they can show people)
thumb_every_s = 10.0
thumb_width = 320
keep_days = 7.0            # older records are deleted
max_mb = 200               # the folder never grows beyond this

[home]
enabled = false           # true = Bob may turn the lights in his room on and off through Home Assistant (see manual 19)
url = "http://homeassistant.local:8123"   # better: your Home Assistant's IP address
wifi = []                  # Wi-Fi network name(s) where Home Assistant exists. Empty = try everywhere. At other houses he leaves it alone
rooms = []                 # Home Assistant areas he may control, for example ["Kitchen", "Living Room"]
location_entity = ""       # a sensor whose state is the room Bob is in, for example "sensor.bob_area"
quiet_start = "22:00"      # no turning lights ON between these times (off is fine). Empty = never quiet
quiet_end = "07:00"
max_per_minute = 6
cooldown_s = 30.0
dark_below = 40.0          # camera brightness (0-255)
bright_above = 90.0
# Room tags: printed AprilTags by each door (make them with tag_tools.py; manual 19). Tag number = room.
tags = {}                  # for example { 1 = "Kitchen", 2 = "Living Room" }
tag_min_px = 40.0          # a tag must look this wide (pixels) to be believed, so he has to be close
tag_valid_s = 300.0
tag_search_speed = 0.35    # /locate: how fast he turns on the spot looking for a tag
tag_search_seconds = 25.0  # ...and how long he looks
tag_max_move_s = 20.0      # the room is forgotten once the wheels have run this long since the last tag

[power]
enabled = true             # people can power the Pi off with /shutdown, then /shutdown confirm (Claude cannot). See manual 21
who = ["owner", "operator"]   # also "dashboard" (anyone with a dashboard token) and "viewer" (watch-only shared-console users)
confirm_seconds = 30.0

[remote]
enabled = false           # true = friends with a Pi login can attach to this console with `bob-console` (manual 20)
socket = "/tmp/bob-console.sock"
operators = ["bobops"]     # Linux groups whose members may run commands
viewers = ["bobview"]      # Linux groups that may only watch (and press the emergency stop)
deny = ["quit"]            # commands only you (the account Bob runs as) may run
max_clients = 4

[gamepad]
enabled = false            # true = drive with an Xbox controller (manual 22). Start = manual drive, B = emergency stop
device = "auto"            # or a path such as "/dev/input/js1"
deadzone = 0.15
slow_factor = 0.4          # speed while LB is held
# Button and stick numbers (Xbox layout of Linux's xpad driver). Change them if /check shows the wrong buttons do things.
axis_turn = 0
axis_throttle = 1
btn_talk = 0
btn_estop = 1
btn_resume = 3
btn_slow = 4
btn_back = 6
btn_drive = 7

[startup]
stagger = true             # start the heavy parts one at a time, waiting for the CPU to calm down, so boot can't overload the Pi
calm_cpu_percent = 60.0    # a part starts once the CPU is below this busy, twice in a row...
max_wait_s = 25.0          # ...or after waiting this long
step_pause_s = 2.0         # least pause between parts

[index]
enabled = true             # a searchable index of the timeline, notes, people, radio, warnings and manuals (/search)
interval_s = 5.0
keep_days = 30.0           # radio and warning records older than this are dropped
log_warnings = true
manuals = true
max_rows = 200000
ai = false                # true = Claude may search past timeline and radio records (the recall tool)

[brain]
model = "claude-sonnet-5-5"
effort = "low"             # low = quicker reactions; medium/high = more careful
tick_seconds = 2.0
think_when = "interval"    # "change" = think only when something changed (much cheaper; manual 04). "interval" = every tick
idle_max_s = 60.0          # "change" mode: still think at least this often
change_percent = 4.0       # "change" mode: think when this % of the picture changed noticeably
change_distance_cm = 15.0  # "change" mode: ...or the distance sensor moved this far
max_steps_per_tick = 8
fallbacks = true
start_paused = true
goal = "Explore your surroundings carefully, avoid bumping into things, and be a friendly companion to any people you meet."
