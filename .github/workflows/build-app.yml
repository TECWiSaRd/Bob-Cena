# Builds the Bob app (Mac and Android) on GitHub's own computers, so you don't need Android tools on your Mac.
#
#   Publish a release  ->  the Mac zip and the Android APK are built and attached to that release.
#   Or:  Actions tab -> "Build the Bob app" -> Run workflow  ->  download them from the run's page ("Artifacts").
#
# Nothing here uses a secret other than GitHub's own token. The apps are not signed with an Apple or Google developer
# identity: see manuals/25-the-bob-app.md for what your friends do the first time they open them (on a Mac: System Settings, Privacy & Security, Open Anyway).
name: Build the Bob app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write        # to attach the files to a release

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python side of the app tests
        run: |
          pip install -r requirements.txt
          python -m unittest tests.test_appapi tests.test_app_vectors tests.test_bonjour tests.test_dash_js
      - name: App checks
        working-directory: app
        env:
          BOB_PYTHON: python
        run: |
          flutter pub get
          flutter analyze
          flutter test

  python:
    name: "All Python tests (informational, does not block the app builds)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt numpy opencv-contrib-python-headless
      - run: python -m unittest discover -s tests

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release signing key
        # The same key every time is what lets a new APK install over the old one. It lives in GitHub secrets
        # (BOB_KEYSTORE_BASE64, BOB_KEYSTORE_PASSWORD, BOB_KEY_PASSWORD, BOB_KEY_ALIAS), never in the repository.
        env:
          KEYSTORE_B64: ${{ secrets.BOB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOB_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BOB_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOB_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "::error::No signing key is set up, so this release would be signed with a throw-away key and could not update older installs. Add the four BOB_KEY* secrets (manual 25), then publish again."
              exit 1
            fi
            echo "::warning::No signing key set up: this test build uses a throw-away key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bob-release.jks"
          {
            echo "BOB_KEYSTORE_FILE=$RUNNER_TEMP/bob-release.jks"
            echo "BOB_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BOB_KEY_PASSWORD=$KEY_PASSWORD"
            echo "BOB_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
      - name: Build
        working-directory: app
        # Android only installs an update with a HIGHER build number, so use the run number (it always goes up).
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}
      - name: Check who signed it
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | tee signer.txt
          grep -E "certificate SHA-256" signer.txt | head -1 | sed 's/^/Signing key fingerprint: /' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "release" ] && grep -q "Android Debug" signer.txt; then
            echo "::error::This APK was signed with the throw-away debug key, not the release key."
            exit 1
          fi
      - name: Name it
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Bob-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bob-android
          path: Bob-android.apk
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Bob-android.apk --clobber

  macos:
    name: Mac app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - name: Zip it (ditto keeps what macOS needs)
        run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/Bob.app Bob-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bob-mac
          path: Bob-mac.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Bob-mac.zip --clobber
