# Builds the Bob app (Mac and Android) on GitHub's own computers, so you don't need Android tools on your Mac.
#
#   Publish a release  ->  the Mac zip and the Android APK are built and attached to that release.
#   Or:  Actions tab -> "Build the Bob app" -> Run workflow  ->  download them from the run's page ("Artifacts").
#
# Nothing here uses a secret other than GitHub's own token. The apps are not signed with an Apple or Google developer
# identity: see manuals/25-the-bob-app.md for what your friends do the first time they open them.
name: Build the Bob app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write        # to attach the files to a release

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python side of the app tests
        run: |
          pip install -r requirements.txt
          python -m unittest tests.test_appapi tests.test_app_vectors tests.test_bonjour tests.test_dash_js
      - name: App checks
        working-directory: app
        env:
          BOB_PYTHON: python
        run: |
          flutter pub get
          flutter analyze
          flutter test

  python:
    name: "All Python tests (informational, does not block the app builds)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt numpy opencv-contrib-python-headless
      - run: python -m unittest discover -s tests

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Name it
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Bob-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bob-android
          path: Bob-android.apk
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Bob-android.apk --clobber

  macos:
    name: Mac app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - name: Zip it (ditto keeps what macOS needs)
        run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/Bob.app Bob-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bob-mac
          path: Bob-mac.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Bob-mac.zip --clobber
